[project]
name = "fx-stable"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbstripout>=0.9.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "typer>=0.28.0",
]

[dependency-groups]
data = [
    "ccxt>=4.5.92",
    "fredapi>=0.5.2",
    "yfinance>=1.7.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
ml = [
    "optuna>=5.0.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "xgboost>=3.4.1",
]
mlops = [
    "dvc>=3.67.1",
    "mlflow>=3.18.0",
]
